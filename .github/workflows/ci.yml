name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs opt into more only if needed.
permissions:
  contents: read

env:
  PNPM_VERSION: "11.1.2"
  NODE_VERSION: "22"

jobs:
  ci:
    name: Typecheck / Lint / Scan
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (supply-chain hardening); the trailing
      # comment records the human-readable tag the SHA corresponds to.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Investor-boundary tripwire (admin commands, forbidden actions, labels)
        run: pnpm tripwire
      - name: Route-manifest gate (CM-04 — deny-by-default API inventory, method parity)
        run: pnpm route-manifest
      - name: Contract assertions (taxonomy, receipts-vs-access-log, immutability)
        run: pnpm contract-test
      - name: Unit tests (@refi/api-clients)
        run: pnpm --filter @refi/api-clients test
      - name: Scan copy for blocked terms
        run: pnpm scan-copy
        env:
          CI: true

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Secret scanning (blocking). We use the gitleaks CLI (version-pinned)
      # rather than gitleaks-action: the action requires a paid license for
      # organization-owned repos, but the CLI is free. Runs before install, so
      # `.` is the tracked tree only (no node_modules to slow it down).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Dependency audit. REPORT-ONLY for now: the repo carries a known advisory
      # backlog (see Dependabot). Renovate (renovate.json) burns it down; once
      # clear, drop `continue-on-error` to make this a blocking gate (#29).
      - name: Dependency audit (report-only)
        continue-on-error: true
        run: pnpm audit --prod

  e2e:
    name: E2E (production artifact)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Install Playwright browser
        run: pnpm --filter @refi/web exec playwright install --with-deps chromium
      # The Playwright webServer builds and starts the production artifact
      # itself, and supplies its own environment (see apps/web/playwright.config.ts).
      # Nothing is exported here, so this job cannot diverge from a local run.
      - name: Run E2E against the production artifact
        run: pnpm e2e
      # Reuses the build the step above produced and reboots it at the
      # September stage (REFI_RELEASE_STAGE=signal). Sequential, same port:
      # NEXT_PUBLIC_* are inlined at build time, so a different port would make
      # the client's own fetches cross-origin.
      - name: Signal-stage smoke (September release stage)
        run: pnpm e2e:signal
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.refi.trading
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      NEXT_PUBLIC_REFI_ENV: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Build
        run: pnpm --filter @refi/web build
      - name: Report bundle size
        run: |
          echo "## Bundle sizes (top 20 chunks)" >> $GITHUB_STEP_SUMMARY
          find apps/web/.next/static/chunks -name "*.js" -exec du -sh {} \; 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true
