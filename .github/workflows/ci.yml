name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs opt into more only if needed.
permissions:
  contents: read

env:
  PNPM_VERSION: "11.1.2"
  NODE_VERSION: "22"

jobs:
  ci:
    name: Typecheck / Lint / Scan
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (supply-chain hardening); the trailing
      # comment records the human-readable tag the SHA corresponds to.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Investor-boundary tripwire (admin commands, forbidden actions, labels)
        run: pnpm tripwire
      - name: Contract assertions (taxonomy, receipts-vs-access-log, immutability)
        run: pnpm contract-test
      - name: Unit tests (@refi/api-clients)
        run: pnpm --filter @refi/api-clients test
      - name: Scan copy for blocked terms
        run: pnpm scan-copy
        env:
          CI: true

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # Secret scanning (blocking). gitleaks-action is free for public repos.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Dependency audit. REPORT-ONLY for now: the repo carries a known advisory
      # backlog (see Dependabot). Renovate (renovate.json) burns it down; once
      # clear, drop `continue-on-error` to make this a blocking gate (#29).
      - name: Dependency audit (report-only)
        continue-on-error: true
        run: pnpm audit --prod

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.refi.trading
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      NEXT_PUBLIC_REFI_ENV: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Build
        run: pnpm --filter @refi/web build
      - name: Report bundle size
        run: |
          echo "## Bundle sizes (top 20 chunks)" >> $GITHUB_STEP_SUMMARY
          find apps/web/.next/static/chunks -name "*.js" -exec du -sh {} \; 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true
