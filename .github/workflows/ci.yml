name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.1.2"
  NODE_VERSION: "22"

jobs:
  ci:
    name: Typecheck / Lint / Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Investor-boundary tripwire (admin commands, forbidden actions, labels)
        run: pnpm tripwire
      - name: Contract assertions (taxonomy, receipts-vs-access-log, immutability)
        run: pnpm contract-test
      - name: Scan copy for blocked terms
        run: pnpm scan-copy
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.refi.trading
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      NEXT_PUBLIC_REFI_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Build
        run: pnpm --filter @refi/web build
      - name: Report bundle size
        run: |
          echo "## Bundle sizes (top 20 chunks)" >> $GITHUB_STEP_SUMMARY
          find apps/web/.next/static/chunks -name "*.js" -exec du -sh {} \; 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true
