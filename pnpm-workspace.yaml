packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@sentry/cli": true
  bufferutil: true
  core-js: true
  esbuild: true
  keccak: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

onlyBuiltDependencies:
  - "@sentry/cli"
  - bufferutil
  - core-js
  - esbuild
  - keccak
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
  - utf-8-validate
