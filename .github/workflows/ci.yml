name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.1.2"
  NODE_VERSION: "22"

# Actions are pinned to commit SHAs (S6). Tag comments record the intended
# version; `pnpm dlx renovate-config-validator` and Renovate keep them in
# sync — a version bump is a reviewed diff, not a silent tag shift.

jobs:
  ci:
    name: Typecheck / Lint / Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Route manifest gate (S4b)
        run: pnpm --filter @refi/web route-manifest
      - name: Investor-boundary tripwire (admin commands, forbidden actions, labels)
        run: pnpm tripwire
      - name: Contract assertions (taxonomy, receipts-vs-access-log, immutability)
        run: pnpm contract-test
      - name: Unit tests (@refi/api-clients)
        run: pnpm --filter @refi/api-clients test
      - name: Scan copy for blocked terms
        run: pnpm scan-copy
        env:
          CI: true

  security:
    name: Security scans (S6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # gitleaks scans history for committed secrets. Fails the build on any
      # finding; the .gitleaks.toml (if added later) tunes false positives.
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # osv-scanner walks pnpm-lock.yaml and every subpackage manifest for
      # known vulnerabilities in production dependencies. Non-prod (devDeps)
      # noise is filtered at the config level if it appears.
      - name: osv-scanner (dependency audit)
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
            ./

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.refi.trading
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      NEXT_PUBLIC_REFI_ENV: staging
      # Server-only twin. Security decisions read REFI_ENV, never
      # NEXT_PUBLIC_REFI_ENV. See lib/bff/auth.ts.
      REFI_ENV: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        run: pnpm --filter @refi/api-clients build
      - name: Build
        run: pnpm --filter @refi/web build
      - name: Report bundle size
        run: |
          echo "## Bundle sizes (top 20 chunks)" >> $GITHUB_STEP_SUMMARY
          find apps/web/.next/static/chunks -name "*.js" -exec du -sh {} \; 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true
